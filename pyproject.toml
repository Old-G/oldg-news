[project]
name = "radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "fast-langdetect>=1.0.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
