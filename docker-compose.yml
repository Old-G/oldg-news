name: radar

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: radar
    # small instance: the host is shared with another service
    command: postgres -c shared_buffers=128MB -c maintenance_work_mem=128MB
    volumes:
      - pgdata:/var/lib/postgresql
      # applied once, on an empty volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # the scheduler (fetch every 2h, digest waves); one-off jobs: `docker compose run --rm -T worker python -m jobs.…`
  worker:
    build: .
    image: radar-worker
    command: ["python", "-m", "jobs.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  # long polling; the only process that reads the bot's updates
  bot:
    build: .
    image: radar-worker
    command: ["python", "-m", "bot.main"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m  # ~215 MB in use: aiogram + the shared pipeline imports

  # daily pg_dump into its own volume, the newest BACKUP_KEEP kept; by hand:
  # `docker compose exec backup sh /db/backup.sh now` (a dump) or `… check` (restore into a scratch db and compare)
  # off since 17.10.2026 (owner's call): starts only with `docker compose --profile backup up -d backup`
  backup:
    profiles: ["backup"]
    image: pgvector/pgvector:pg18
    entrypoint: ["sh", "/db/backup.sh", "loop"]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: radar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: radar
      TZ: Europe/Minsk
      BACKUP_AT: ${BACKUP_AT:-04:30}  # before the 07:00 preparation, between two fetches
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - backups:/backups
      - ./db:/db:ro  # the folder, not the file: a file mount keeps the old copy after git pull
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m

volumes:
  pgdata:
  backups:
